name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the declared dependencies
        run: uv sync
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Run the tests
        run: uv run --with pytest pytest tests -q

  release:
    name: Publish the GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag matches the declared version
        run: |
          set -euo pipefail
          declared=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $declared." >&2
            exit 1
          fi
      - name: Check that the extension declares the same version
        run: |
          set -euo pipefail
          declared=$(python3 -c "import re,pathlib;print(re.search(r'version=\"([^\"]+)\"', pathlib.Path('extension.py').read_text()).group(1))")
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the extension version $declared." >&2
            exit 1
          fi
      # The extension center publishes this release automatically: Blockether/vis runs
      # "Publish reviewed extension" daily for first-party extensions, and that workflow
      # can also be dispatched by hand for an immediate publication.
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
