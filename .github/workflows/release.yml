name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the declared dependencies
        run: uv sync --group dev
      - name: Check formatting
        run: uv run --group dev ruff format --check .
      - name: Lint
        run: uv run --group dev ruff check .
      - name: Run the tests
        run: uv run --group dev pytest tests -q

  release:
    name: Publish the GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag matches the declared version
        run: |
          set -euo pipefail
          declared=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $declared." >&2
            exit 1
          fi
      - name: Check that the extension declares the same version
        run: |
          set -euo pipefail
          declared=$(python3 -c "import re,pathlib;print(re.search(r'version=\"([^\"]+)\"', pathlib.Path('extension.py').read_text()).group(1))")
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the extension version $declared." >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # Start the publication in the Vis Extension Center at once. The schedule in Blockether/vis
      # also publishes this release, but GitHub starts scheduled runs some hours late.
      - name: Publish the release in the Vis Extension Center
        env:
          GH_TOKEN: ${{ secrets.VIS_EXTENSION_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set the VIS_EXTENSION_PUBLISH_TOKEN secret. Without it, the schedule in Blockether/vis publishes this release some hours later."
            exit 0
          fi
          gh workflow run extension-publish.yml --repo Blockether/vis \
            -f repository_url="https://github.com/$GITHUB_REPOSITORY" \
            -f subdirectory="" \
            -f release_tag="$GITHUB_REF_NAME" \
            -f revision="$GITHUB_SHA"
